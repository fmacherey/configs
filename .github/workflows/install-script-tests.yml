name: Install Script Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-install-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x install.sh
          chmod +x tests/test_install.sh

      - name: Run install script tests
        run: tests/test_install.sh
